# Smoke config: 2 tiny decoders, 1000 steps each, ~30 s total.
# Used to verify the pipeline end-to-end (train -> JSON -> R pack -> .rds).
# Not for shipping; the surrogate quality at 1000 steps is poor.

arch: MLPDeepRV
arch_version: "smoke.0"
domain: unit_interval
ls_trained_range: [0.01, 1.0]

training:
  steps: 1000
  batch: 32
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.01
  clip_global_norm: 3.0
  jitter: 5e-4
  seed: 0

n_match_cases: 4

grids: [10]
kernels: [matern_1_2, matern_3_2]

output_dir: benchmarks/vae/rstan/artifacts/decoders/smoke
